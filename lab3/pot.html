<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TamraVeda - The Smart Copper Vessel</title>
    <style>
        :root {
            --copper-primary: #d35400;
            --copper-light: #e67e22;
            --copper-dark: #ba4a00;
            --ayur-green: #27ae60;
            --charcoal: #2c3e50;
            --cream: #fdfaf6;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Segoe UI', serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--charcoal);
            background-color: var(--cream);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(253, 250, 246, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(211, 84, 0, 0.1);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--copper-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: serif;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--charcoal);
            font-weight: 500;
            font-family: 'Segoe UI', sans-serif;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--copper-primary);
        }

        .cta-btn {
            background: var(--copper-primary);
            color: var(--white);
            padding: 0.6rem 1.8rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.2);
        }

        .cta-btn:hover {
            background: var(--copper-dark);
            transform: translateY(-1px);
        }

        /* Hero Section */
        #hero {
            padding: 9rem 8% 4rem;
            display: flex;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 80% 20%, #fff3e6 0%, var(--cream) 100%);
        }

        .hero-content {
            flex: 1;
            padding-right: 3rem;
        }

        .hero-content h1 {
            font-size: 3.8rem;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            color: var(--charcoal);
        }

        .hero-content h1 span {
            color: var(--copper-primary);
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2.5rem;
            max-width: 550px;
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* Copper Bottle SVG with Mandala/Indian Craft Motif Elements */
        .bottle-container {
            position: relative;
            animation: gentle-float 5s ease-in-out infinite;
        }

        .bottle-svg {
            width: 260px;
            height: auto;
            filter: drop-shadow(0 25px 35px rgba(186, 74, 0, 0.25));
        }

        @keyframes gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Heritage Features Section */
        #features {
            padding: 7rem 8%;
            background: var(--white);
            text-align: center;
        }

        .section-title {
            font-size: 2.6rem;
            color: var(--charcoal);
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 4rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 3rem;
        }

        .feature-card {
            padding: 3rem 2rem;
            background: var(--cream);
            border: 1px solid rgba(211, 84, 0, 0.1);
            border-radius: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(211, 84, 0, 0.08);
        }

        .feature-icon {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .feature-card h3 {
            margin-bottom: 1rem;
            font-size: 1.4rem;
            color: var(--copper-dark);
        }

        .feature-card p {
            color: #555;
            font-size: 0.95rem;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Copper Health / Tech Balance */
        #ayurveda-tech {
            padding: 7rem 8%;
            display: flex;
            align-items: center;
            gap: 5rem;
        }

        .dual-content {
            flex: 1;
        }

        .badge {
            display: inline-block;
            background: rgba(39, 174, 96, 0.1);
            color: var(--ayur-green);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 1rem;
        }

        .dual-content h2 {
            font-size: 2.4rem;
            margin-bottom: 1.5rem;
        }

        .dual-content p {
            margin-bottom: 1.5rem;
            color: #444;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Modern App Interface with a Desi Touch */
        .app-mockup {
            flex: 1;
            background: #1a252f;
            border-radius: 32px;
            padding: 2rem 1.5rem;
            width: 310px;
            max-width: 310px;
            height: 560px;
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 4px solid #2c3e50;
            font-family: 'Segoe UI', sans-serif;
        }

        .app-header {
            text-align: center;
            border-bottom: 1px solid #34495e;
            padding-bottom: 0.8rem;
        }

        .app-header h4 { font-weight: 500; letter-spacing: 1px; color: var(--copper-light); }

        .app-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .copper-dial {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(#1a252f 62%, transparent 63%), conic-gradient(var(--copper-light) 65%, #34495e 0%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(230, 126, 34, 0.15);
        }

        .dial-val {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--white);
        }

        .app-alert {
            background: rgba(39, 174, 96, 0.15);
            border: 1px solid var(--ayur-green);
            color: #5cd68a;
            font-size: 0.85rem;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }

        /* Footer */
        footer {
            background: var(--charcoal);
            color: var(--cream);
            padding: 4rem 8% 2rem;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 2.5rem;
        }

        .footer-links a {
            color: #bdc3c7;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--copper-light);
        }

        footer p {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            border-top: 1px solid #34495e;
            padding-top: 1.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav { padding: 1rem 5%; }
            .nav-links { display: none; }
            #hero { flex-direction: column; text-align: center; padding: 7rem 5% 3rem; }
            .hero-content { padding-right: 0; margin-bottom: 3rem; }
            .hero-content h1 { font-size: 2.6rem; }
            #ayurveda-tech { flex-direction: column; text-align: center; gap: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            🪔 TamraVeda
        </div>
        <ul class="nav-links">
            <li><a href="#hero">The Vessel</a></li>
            <li><a href="#features">Ayurvedic Benefits</a></li>
            <li><a href="#ayurveda-tech">Smart Integration</a></li>
        </ul>
        <a href="#hero" class="cta-btn">Bring Home Wellness</a>
    </nav>

    <!-- Hero Section -->
    <section id="hero">
        <div class="hero-content">
